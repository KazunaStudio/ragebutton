<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rage Button</title>
</head>
<body>
<main class="card" id="card">
  <h1>😤 Rage Button</h1>
  <div class="sub">For those moments when the computer is testing you.</div>

  <button id="rageButton" aria-label="Rage button"></button>
  <div id="reaction">Ready when you are.</div>

  <section class="stats">
    <div class="stat"><span class="number" id="todayCount">0</span><span class="label">TODAY'S RAGE</span></div>
    <div class="stat"><span class="number" id="totalCount">0</span><span class="label">ALL-TIME RAGE</span></div>
  </section>

  <div class="last" id="lastPressed">Never pressed. Suspiciously peaceful.</div>

  <div class="controls">
    <input id="nameInput" maxlength="40" placeholder="Give your rage button a name">
    <button class="small" id="saveName">Change Name</button>
    <button class="small danger" id="reset">Reset Data</button>
  </div>

  <details>
    <summary>Rage history</summary>
    <ol id="history"></ol>
  </details>

  <footer class="footer">
    © 2026 KazunaStudio
  </footer>
</main>

<script>
const KEY = "kazuRageButton_v1";
const reactions = [
  "Rage registered. 😤",
  "+1 emotional damage.",
  "Understandable. Logged.",
  "The button accepts your suffering.",
  "Complaint successfully submitted to absolutely nobody.",
  "Yep. That deserved a click.",
  "System status: still annoying.",
  "Deeply inconvenient. Added to the statistics."
];

let state = JSON.parse(localStorage.getItem(KEY) || "null") || {
  buttonName: "I'M DONE",
  clicks: []
};

const $ = id => document.getElementById(id);
function localDay(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
  render();
}
function render() {
  $("rageButton").textContent = state.buttonName || "I'M DONE";
  $("nameInput").value = state.buttonName || "";
  const today = localDay(new Date().toISOString());
  $("totalCount").textContent = state.clicks.length;
  $("todayCount").textContent = state.clicks.filter(x => localDay(x) === today).length;
  $("lastPressed").textContent = state.clicks.length
    ? "Last pressed: " + new Date(state.clicks[state.clicks.length-1]).toLocaleString()
    : "Never pressed. Suspiciously peaceful.";
  $("history").innerHTML = state.clicks.slice().reverse().slice(0,100)
    .map(x => `<li>${new Date(x).toLocaleString()}</li>`).join("") ||
    "<li>No rage recorded yet.</li>";
}
$("rageButton").addEventListener("click", () => {
  state.clicks.push(new Date().toISOString());
  $("reaction").textContent = reactions[Math.floor(Math.random()*reactions.length)];
  $("rageButton").classList.add("hit");
  $("card").classList.add("shake");
  setTimeout(() => {
    $("rageButton").classList.remove("hit");
    $("card").classList.remove("shake");
  }, 300);
  save();
});
$("saveName").addEventListener("click", () => {
  const name = $("nameInput").value.trim();
  if (name) {
    state.buttonName = name;
    $("reaction").textContent = `Button renamed to "${name}".`;
    save();
  }
});
$("nameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") $("saveName").click();
});
$("reset").addEventListener("click", () => {
  if (confirm("Reset all rage clicks and history?")) {
    state.clicks = [];
    $("reaction").textContent = "The rage ledger has been cleansed.";
    save();
  }
});
render();
</script>

  <style>
  :root { font-family: Inter, system-ui, Arial, sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at top, #351010, #120b0b 58%, #090707);
    color: #fff; padding: 24px;
  }
  .card {
    width: min(720px, 100%); background: rgba(25,15,15,.94);
    border: 1px solid #5d2929; border-radius: 24px; padding: 28px;
    box-shadow: 0 24px 70px rgba(0,0,0,.45); text-align: center;
  }
  h1 { margin: 0 0 6px; font-size: clamp(28px,5vw,44px); }
  .sub { opacity:.72; margin-bottom: 26px; }
  #rageButton {
    width: min(360px, 90%); aspect-ratio: 1; border-radius: 50%;
    border: 12px solid #6e1515; background: linear-gradient(#ff4d4d,#bf1111);
    color:white; font-weight:900; font-size: clamp(22px,5vw,38px);
    box-shadow: 0 14px 0 #721010, 0 25px 45px rgba(255,0,0,.25);
    cursor:pointer; padding: 24px; transition:.08s transform, .08s box-shadow;
    overflow-wrap:anywhere;
  }
  #rageButton:active, #rageButton.hit {
    transform: translateY(10px) scale(.98);
    box-shadow: 0 4px 0 #721010, 0 12px 24px rgba(255,0,0,.2);
  }
  #reaction { min-height: 28px; margin: 24px 0 14px; font-weight:700; }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:18px 0; }
  .stat { background:#201313; border:1px solid #472323; padding:16px; border-radius:16px; }
  .number { display:block; font-size:32px; font-weight:900; }
  .label { opacity:.7; font-size:13px; }
  .last { opacity:.68; font-size:14px; margin-bottom:20px; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  input {
    min-width:220px; flex:1; background:#100b0b; color:#fff; border:1px solid #5d3333;
    border-radius:10px; padding:12px 14px; font-size:15px;
  }
  button.small {
    border:0; border-radius:10px; padding:12px 16px; cursor:pointer;
    background:#eee; color:#171111; font-weight:700;
  }
  button.danger { background:#3b1919; color:#ffb3b3; border:1px solid #693030; }
  details { margin-top:22px; text-align:left; }
  summary { cursor:pointer; opacity:.8; }
  #history { max-height:180px; overflow:auto; padding-left:22px; opacity:.8; font-size:14px; }
  .shake { animation: shake .18s linear 2; }
  @keyframes shake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)} }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    opacity: 0.45;
    text-align: center;
  }
  </style>
</body>
</html>
